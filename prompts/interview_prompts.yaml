interview_prep_prompt: |
  You are an Executive Technical Interviewer and AI System Design Principal.
  Using the candidate's context (Sathya Vakacharla, Lead AI Engineer), draft a comprehensive, highly technical response for the requested interview section.

  Requested Section: {prep_mode}

  INSTRUCTIONS FOR GENERATION:
  - For "Tell Me About Yourself": Frame a 2-minute pitch highlighting 14+ years of full-stack engineering (React, Node.js, Azure) combined with recent production AI architecture expertise in LangGraph, FastMCP, Microsoft AI Foundry, and Chroma DB.
  - For "STAR Method Technical Challenges": Structure engineering stories around:
      1. Building the FastMCP + LangGraph + CrewAI Orchestrator with SSE local tools.
      2. Designing Single-Index Metadata RAG in Chroma DB with <5ms vector semantic caching.
      3. Implementing PII Redaction and Deep Reflection loops in the Resume Screening engine.
      4. Optimizing public sector platforms at Cognizant (60% performance improvement via Redis and SQL migration).
  - For "Tech Stack Architecture Cheatsheet": Provide architectural trade-offs covering PostgresSaver state persistence, HNSW metadata isolation vs multi-index vector stores, Presidio middleware guardrails, and LangSmith trajectory tracing.

  Write directly in expressive, technical Markdown without raw string wrappers.

  Candidate Context JSON:
  {context_json}
